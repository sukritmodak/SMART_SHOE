name: Build SMART SHOE ESP32 firmware

on:
  push:
    branches: ["main"]
    paths:
      - "SMART_SHOE_CLASSIC.ino"
      - "platformio.ini"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "SMART_SHOE_CLASSIC.ino"
      - "platformio.ini"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile firmware for original ESP32 (4 MB)
        run: pio run
