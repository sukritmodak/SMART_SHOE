[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The original ESP32 module in this project has 4 MB flash.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 115200

; Build only the firmware sketch; ignore website and bridge files.
build_src_filter =
  +<SMART_SHOE_CLASSIC.ino>
